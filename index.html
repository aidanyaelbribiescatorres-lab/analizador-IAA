<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON BET AI</title>
<style>
  :root { --neon:#00FF41; --dark:#050505; --panel:#0a0f0a; --dim:#888; --red:#f55; --yellow:#ff0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--neon); font-family:'Courier New',monospace; min-height:100vh; padding:16px; }
  h1,h2,h3 { text-shadow:0 0 6px var(--neon); }
  .wrap { max-width:1100px; margin:0 auto; }

  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--neon); padding-bottom:12px; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  header h1 { font-size:1.6rem; }
  .cap { text-align:right; }
  .cap .lbl { color:var(--dim); font-size:.7rem; }
  .cap .val { font-size:1.4rem; }

  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  select, input, button, textarea { background:#000; color:var(--neon); border:1px solid var(--neon); border-radius:5px; padding:8px 12px; font-family:inherit; font-size:.9rem; }
  button { cursor:pointer; transition:all .25s; }
  button:hover { background:var(--neon); color:#000; box-shadow:0 0 12px var(--neon); }
  input::placeholder { color:#0a5; }

  .tabs { display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid #033; flex-wrap:wrap; }
  .tab { padding:10px 16px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; opacity:.6; cursor:pointer; }
  .tab.active { opacity:1; border-color:var(--neon); background:var(--panel); }

  .panel { display:none; }
  .panel.active { display:block; }

  .card { background:var(--panel); border:1px solid #052; border-radius:8px; padding:14px; margin-bottom:12px; }

  /* Badges de estado */
  .badge { font-size:.7rem; padding:2px 8px; border-radius:10px; border:1px solid var(--neon); }
  .badge.live { background:#300; border-color:var(--red); color:var(--red); animation:pulse 1.5s infinite; }
  .badge.final { color:var(--dim); border-color:var(--dim); }
  .badge.scheduled { color:var(--yellow); border-color:var(--yellow); }
  @keyframes pulse { 50%{ opacity:.4; } }

  .game-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:6px; }
  .teams-row { display:flex; justify-content:space-between; align-items:center; margin:6px 0; }
  .team { display:flex; align-items:center; gap:8px; }
  .team img { width:28px; height:28px; }
  .score { font-size:1.4rem; font-weight:bold; }
  .vs { color:var(--dim); font-size:.9rem; }

  .game-actions { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

  table { width:100%; border-collapse:collapse; font-size:.78rem; margin-top:8px; }
  th, td { padding:5px 6px; text-align:center; border-bottom:1px solid #042; }
  th { color:var(--dim); font-weight:normal; }
  td.name { text-align:left; white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis; }

  /* Predicción */
  .pred-box { background:#020e02; border:1px solid var(--neon); border-radius:10px; padding:16px; margin-bottom:14px; }
  .pred-title { text-align:center; font-size:1rem; margin-bottom:12px; }
  .pred-score { text-align:center; font-size:2rem; font-weight:bold; text-shadow:0 0 10px var(--neon); margin:10px 0; }
  .pred-bars { margin:12px 0; }
  .pred-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:.85rem; }
  .pred-label { width:100px; text-align:right; white-space:nowrap; }
  .pred-bar-wrap { flex:1; background:#031; border-radius:4px; height:14px; overflow:hidden; }
  .pred-bar { height:100%; border-radius:4px; transition:width .4s; }
  .bar-home { background:var(--neon); }
  .bar-draw { background:var(--yellow); }
  .bar-away { background:var(--red); }
  .pred-pct { width:36px; text-align:left; }
  .pred-method { text-align:center; font-size:.7rem; color:var(--dim); margin-top:8px; }
  .pred-winner { text-align:center; font-size:1.1rem; margin:10px 0; }

  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:700px){ .two-col{ grid-template-columns:1fr; } }

  .loading { color:var(--dim); padding:20px; text-align:center; }
  .err { color:var(--red); border:1px solid var(--red); padding:10px; border-radius:6px; margin:8px 0; }

  .drop { border:2px dashed var(--neon); border-radius:10px; padding:30px; text-align:center; cursor:pointer; margin-bottom:14px; }
  .drop:hover { background:#031; }
  #preview-img { max-width:100%; max-height:280px; border-radius:8px; margin-top:10px; }

  .kv { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #042; }
  .kv .k { color:var(--dim); }
  .small { font-size:.75rem; color:var(--dim); }
  .green { color:var(--neon); } .red { color:var(--red); }
  .team-label { font-size:.8rem; color:var(--dim); margin:10px 0 4px; border-top:1px solid #042; padding-top:6px; }

  /* Filtro de estado */
  .filter-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .filter-btn { padding:4px 12px; font-size:.8rem; opacity:.5; }
  .filter-btn.on { opacity:1; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🧠 NEON BET AI</h1>
      <div class="small">SYSTEM ONLINE // NBA · NFL · MLB · NHL · Fútbol</div>
    </div>
    <div class="cap">
      <div class="lbl">CAPITAL DISPONIBLE</div>
      <div class="val" id="capital">$0.00</div>
    </div>
  </header>

  <div class="controls">
    <select id="sport"></select>
    <button onclick="loadLive()">🔄 Cargar partidos</button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="live">📡 Partidos</div>
    <div class="tab" data-tab="preview">📊 Análisis Pre-Partido</div>
    <div class="tab" data-tab="ticket">🎫 Comprobante</div>
    <div class="tab" data-tab="conta">💰 Contabilidad</div>
  </div>

  <!-- PARTIDOS -->
  <div class="panel active" id="panel-live">
    <div class="filter-btns">
      <button class="filter-btn on" data-filter="all" onclick="setFilter('all',this)">Todos</button>
      <button class="filter-btn" data-filter="scheduled" onclick="setFilter('scheduled',this)">🕐 Próximos</button>
      <button class="filter-btn" data-filter="live" onclick="setFilter('live',this)">🔴 En vivo</button>
      <button class="filter-btn" data-filter="final" onclick="setFilter('final',this)">✅ Finales</button>
    </div>
    <div id="live-content" class="loading">Selecciona un deporte y pulsa "Cargar partidos".</div>
  </div>

  <!-- ANÁLISIS PRE-PARTIDO -->
  <div class="panel" id="panel-preview">
    <div class="controls" style="flex-wrap:wrap">
      <input id="pv-home" placeholder="Equipo local (ej: Lakers)" style="flex:1;min-width:160px" />
      <input id="pv-away" placeholder="Equipo visitante (ej: Celtics)" style="flex:1;min-width:160px" />
      <button onclick="loadPreview()">🔍 Analizar</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input id="pv-event" placeholder="o event_id del partido (opcional)" style="flex:1" />
    </div>
    <div id="preview-content"></div>
  </div>

  <!-- COMPROBANTE -->
  <div class="panel" id="panel-ticket">
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      📷 Toca aquí para subir la foto de tu comprobante
      <input type="file" id="file" accept="image/*" hidden />
    </div>
    <img id="preview-img" style="display:none" />
    <button onclick="analizarTicket()" id="btn-analizar" style="display:none;margin-bottom:14px">🔍 Analizar apuesta</button>
    <div id="ticket-content"></div>
  </div>

  <!-- CONTABILIDAD -->
  <div class="panel" id="panel-conta">
    <div class="card"><h3>Resumen</h3><div id="conta-stats"></div></div>
    <h3 style="margin:12px 0">Historial</h3>
    <div id="conta-list"></div>
    <button onclick="resetHist()" style="margin-top:12px">🗑 Borrar historial</button>
  </div>

</div>
<script>
const SPORTS = {
  "🏀 NBA":              { sport:"basketball", league:"nba" },
  "🏈 NFL":              { sport:"football",   league:"nfl" },
  "⚾ MLB":              { sport:"baseball",   league:"mlb" },
  "🏒 NHL":              { sport:"hockey",     league:"nhl" },
  "⚽ Premier League":   { sport:"soccer",     league:"eng.1" },
  "⚽ La Liga":          { sport:"soccer",     league:"esp.1" },
  "⚽ Champions League": { sport:"soccer",     league:"uefa.champions" },
  "⚽ Liga MX":          { sport:"soccer",     league:"mex.1" },
  "⚽ MLS":              { sport:"soccer",     league:"usa.1" },
  "⚽ Serie A":          { sport:"soccer",     league:"ita.1" },
  "⚽ Bundesliga":       { sport:"soccer",     league:"ger.1" },
};

// Setup selector
const sel = document.getElementById("sport");
for (const name in SPORTS) {
  const o = document.createElement("option");
  o.value = name; o.textContent = name; sel.appendChild(o);
}
function cfg(){ return SPORTS[sel.value]; }

// Tabs
document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab,.panel").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    document.getElementById("panel-"+t.dataset.tab).classList.add("active");
    if (t.dataset.tab === "conta") renderConta();
  };
});

// ── Capital / historial ──
function getHist(){ try{ return JSON.parse(localStorage.getItem("neonbet_hist")||"[]"); }catch{ return []; } }
function setHist(h){ localStorage.setItem("neonbet_hist", JSON.stringify(h)); updateCapital(); }
function getSaldo(){ return parseFloat(localStorage.getItem("neonbet_saldo")||"100"); }
function updateCapital(){
  const net = getHist().reduce((s,b) =>
    s + (b.resultado==="ganada"?((b.ganancia_potencial||0)-(b.monto_apostado||0)):
         b.resultado==="perdida"?-(b.monto_apostado||0):0), 0);
  document.getElementById("capital").textContent = "$"+(getSaldo()+net).toFixed(2);
}
updateCapital();

// ── LIVE / PARTIDOS ──────────────────────────────────────────────────────────
let allGames = [], currentFilter = "all";

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  renderGames();
}

async function loadLive(){
  const c = cfg();
  const box = document.getElementById("live-content");
  box.innerHTML = '<div class="loading">🔄 Cargando partidos...</div>';
  try {
    const r = await fetch(`/api/live?sport=${c.sport}&league=${c.league}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    allGames = d.games || [];
    window._liveLabels = d.stat_labels || {};
    renderGames();
  } catch(e){ box.innerHTML = `<div class="err">Error: ${e.message}</div>`; }
}

function renderGames(){
  const box = document.getElementById("live-content");
  const labels = window._liveLabels || {};
  let filtered = allGames;
  if (currentFilter === "live")      filtered = allGames.filter(g => g.is_live);
  else if (currentFilter === "final") filtered = allGames.filter(g => g.is_final);
  else if (currentFilter === "scheduled") filtered = allGames.filter(g => !g.is_live && !g.is_final);
  if (!filtered.length){ box.innerHTML = '<div class="loading">Sin partidos en esta categoría.</div>'; return; }
  box.innerHTML = filtered.map(g => gameCard(g, labels)).join("");
}

function gameCard(g, labels){
  const t = g.teams || [];
  const home = t.find(x=>x.home) || t[0] || {};
  const away = t.find(x=>!x.home) || t[1] || {};
  const isScheduled = !g.is_live && !g.is_final;
  const badgeCls = g.is_live ? "live" : g.is_final ? "final" : "scheduled";
  const dateStr = g.date ? new Date(g.date).toLocaleString("es-MX",{hour:"2-digit",minute:"2-digit",weekday:"short",day:"numeric",month:"short"}) : "";

  let boxHtml = "";
  if (g.box_score && g.box_score.length){
    boxHtml = g.box_score.map(tm => boxTable(tm, labels)).join("");
  }

  return `<div class="card" data-live="${g.is_live}" data-final="${g.is_final}">
    <div class="game-head">
      <span class="badge ${badgeCls}">${g.is_live?"🔴 EN VIVO":g.is_final?"FINAL":"🕐 PRÓXIMO"}</span>
      <span class="small">${dateStr}${g.venue?" · "+g.venue:""}</span>
    </div>
    <div class="teams-row">
      <div class="team">${away.logo?`<img src="${away.logo}">`:""}${away.name||"Visitante"}</div>
      <div class="score">${isScheduled?`<span class="vs">VS</span>`:`${away.score||"—"} : ${home.score||"—"}`}</div>
      <div class="team">${home.name||"Local"}${home.logo?`<img src="${home.logo}">`:""}
      </div>
    </div>
    ${boxHtml}
    <div class="game-actions">
      ${g.event_id?`<button onclick="analyzeGame('${g.event_id}','${(away.name||"").replace(/'/g,"\\'")}','${(home.name||"").replace(/'/g,"\\'")}')">📊 Analizar partido</button>`:""}
    </div>
  </div>`;
}

function boxTable(team, labels){
  if (!team.players || !team.players.length) return "";
  const keys = Object.keys(team.players[0].stats || {});
  if (!keys.length) return "";
  const head = keys.map(k=>`<th>${labels[k]||k}</th>`).join("");
  const rows = team.players.map(p =>
    `<tr><td class="name">${p.name}</td>${keys.map(k=>`<td>${p.stats[k]??"-"}</td>`).join("")}</tr>`
  ).join("");
  return `<div class="team-label">${team.name}</div>
    <table><tr><th class="name">Jugador</th>${head}</tr>${rows}</table>`;
}

function analyzeGame(eventId, awayName, homeName){
  // Ir a tab preview con event_id
  document.querySelector('.tab[data-tab="preview"]').click();
  document.getElementById("pv-event").value = eventId;
  document.getElementById("pv-home").value = homeName;
  document.getElementById("pv-away").value = awayName;
  document.getElementById("preview-content").innerHTML = '<div class="loading">🔄 Cargando análisis...</div>';
  loadPreview();
}

// ── PREVIEW / PREDICCIÓN ─────────────────────────────────────────────────────
async function loadPreview(){
  const c = cfg();
  const home  = document.getElementById("pv-home").value.trim();
  const away  = document.getElementById("pv-away").value.trim();
  const eid   = document.getElementById("pv-event").value.trim();
  const box   = document.getElementById("preview-content");

  let qs = `sport=${c.sport}&league=${c.league}`;
  if (eid)             qs += `&event_id=${encodeURIComponent(eid)}`;
  else if (home&&away) qs += `&home=${encodeURIComponent(home)}&away=${encodeURIComponent(away)}`;
  else { box.innerHTML = `<div class="err">Ingresa dos equipos o un event_id.</div>`; return; }

  box.innerHTML = '<div class="loading">🔄 Calculando predicción... (5-8 seg)</div>';
  try {
    const r = await fetch(`/api/preview?${qs}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    const labels = d.stat_labels || {};
    const pred   = d.prediction;
    const matchDate = d.match?.date ? new Date(d.match.date).toLocaleString("es-MX",{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}) : "";

    box.innerHTML = `
      ${matchDate?`<div class="small" style="text-align:center;margin-bottom:8px">📅 ${matchDate}${d.match?.venue?" · "+d.match.venue:""}</div>`:""}
      ${pred ? predCard(pred, d.away?.name||"Visitante", d.home?.name||"Local") : ""}
      <div class="two-col">
        ${teamStatPanel(d.away, d.stat_keys||[], labels, "Visitante")}
        ${teamStatPanel(d.home, d.stat_keys||[], labels, "Local")}
      </div>
      <div class="two-col" style="margin-top:12px">
        ${rosterPanel(d.away, "Visitante")}
        ${rosterPanel(d.home, "Local")}
      </div>`;
  } catch(e){ box.innerHTML = `<div class="err">Error: ${e.message}</div>`; }
}

function predCard(pred, awayName, homeName){
  const winner = pred.home_win_pct > pred.away_win_pct ? homeName : pred.away_win_pct > pred.home_win_pct ? awayName : "Empate técnico";
  const winnerPct = Math.max(pred.home_win_pct, pred.away_win_pct, pred.draw_pct||0);
  const homeBar = `<div class="pred-row"><span class="pred-label">${homeName}</span><div class="pred-bar-wrap"><div class="pred-bar bar-home" style="width:${pred.home_win_pct}%"></div></div><span class="pred-pct">${pred.home_win_pct}%</span></div>`;
  const drawBar = pred.draw_pct > 0 ? `<div class="pred-row"><span class="pred-label">Empate</span><div class="pred-bar-wrap"><div class="pred-bar bar-draw" style="width:${pred.draw_pct}%"></div></div><span class="pred-pct">${pred.draw_pct}%</span></div>` : "";
  const awayBar = `<div class="pred-row"><span class="pred-label">${awayName}</span><div class="pred-bar-wrap"><div class="pred-bar bar-away" style="width:${pred.away_win_pct}%"></div></div><span class="pred-pct">${pred.away_win_pct}%</span></div>`;
  return `<div class="pred-box">
    <div class="pred-title">🎯 PREDICCIÓN</div>
    <div class="pred-score">${pred.predicted_score}</div>
    <div class="pred-winner">Favorito: <strong>${winner}</strong> (${winnerPct}%)</div>
    <div class="pred-bars">${awayBar}${drawBar}${homeBar}</div>
    ${pred.extra?`<div class="pred-method">${pred.extra}</div>`:""}
    <div class="pred-method">Método: ${pred.method}</div>
  </div>`;
}

function teamStatPanel(team, keys, labels, role){
  if (!team) return "";
  const stats = team.stats || {};
  const validKeys = keys.filter(k => stats[k] != null);
  const rows = validKeys.map(k =>
    `<div class="kv"><span class="k">${labels[k]||k}</span><span>${stats[k]}</span></div>`
  ).join("") || '<div class="small">Stats de equipo no disponibles esta temporada.</div>';
  return `<div class="card">
    <div class="team" style="margin-bottom:8px">
      ${team.logo?`<img src="${team.logo}" style="width:32px;height:32px">`:""}
      <h3>${team.name||role}</h3>
      <span class="small">(${role})</span>
    </div>
    ${rows}
  </div>`;
}

function rosterPanel(team, role){
  if (!team || !team.roster?.length) return "";
  const players = team.roster.slice(0,12);
  const rows = players.map(p =>
    `<div class="kv"><span class="k">${p.jersey?`#${p.jersey}`:"–"} ${p.position||""}</span><span>${p.name}</span></div>`
  ).join("");
  return `<div class="card">
    <h3 style="margin-bottom:8px">${team.name||role} — Plantel</h3>
    ${rows}
  </div>`;
}

// ── TICKET / COMPROBANTE ─────────────────────────────────────────────────────
let ticketBase64 = null, ticketType = "image/jpeg";
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  ticketType = f.type || "image/jpeg";
  const reader = new FileReader();
  reader.onload = () => {
    ticketBase64 = reader.result;
    const img = document.getElementById("preview-img");
    img.src = ticketBase64; img.style.display = "block";
    document.getElementById("btn-analizar").style.display = "inline-block";
  };
  reader.readAsDataURL(f);
});

async function analizarTicket(){
  if (!ticketBase64) return;
  const box = document.getElementById("ticket-content");
  box.innerHTML = '<div class="loading">🔄 Analizando con IA... (Gemini)</div>';
  try {
    const r = await fetch("/api/analizar-comprobante", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ image: ticketBase64, mediaType: ticketType })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "Error analizando");
    const a = d.apuesta;
    box.innerHTML = `<div class="card">
      <h3 style="margin-bottom:10px">Apuesta detectada</h3>
      ${kv("Casa", a.casa)} ${kv("Evento", a.evento)} ${kv("Selección", a.seleccion)}
      ${kv("Monto apostado", a.monto_apostado!=null?`${a.moneda||""} ${a.monto_apostado}`:null)}
      ${kv("Cuota", a.cuota)}
      ${kv("Ganancia potencial", a.ganancia_potencial!=null?`${a.moneda||""} ${a.ganancia_potencial}`:null)}
      ${kv("Estado", a.estado)} ${kv("Fecha", a.fecha)}
      ${a.notas?kv("Notas", a.notas):""}
      <button style="margin-top:12px" onclick='saveBet(${JSON.stringify(JSON.stringify(a))})'>💾 Guardar en contabilidad</button>
    </div>`;
  } catch(e){ box.innerHTML = `<div class="err">Error: ${e.message}<br><small>¿Configuraste GEMINI_API_KEY en Vercel?</small></div>`; }
}

function kv(k,v){ return v==null||v===""?"":`<div class="kv"><span class="k">${k}</span><span>${v}</span></div>`; }

function saveBet(json){
  const a = JSON.parse(json);
  const h = getHist();
  h.unshift({ ...a, resultado:"pendiente", ts:Date.now() });
  setHist(h);
  alert("✅ Guardada en contabilidad");
}

// ── CONTABILIDAD ─────────────────────────────────────────────────────────────
function renderConta(){
  const h = getHist();
  const ganadas = h.filter(b=>b.resultado==="ganada").length;
  const perdidas = h.filter(b=>b.resultado==="perdida").length;
  const total = h.reduce((s,b)=>s+(b.monto_apostado||0),0);
  const net = h.reduce((s,b)=>s+(b.resultado==="ganada"?((b.ganancia_potencial||0)-(b.monto_apostado||0)):b.resultado==="perdida"?-(b.monto_apostado||0):0),0);
  document.getElementById("conta-stats").innerHTML =
    kv("Total apuestas",h.length)+kv("Apostado total","$"+total.toFixed(2))+
    kv("Ganadas",ganadas)+kv("Perdidas",perdidas)+
    `<div class="kv"><span class="k">Ganancia neta</span><span class="${net>=0?'green':'red'}">$${net.toFixed(2)}</span></div>`;
  document.getElementById("conta-list").innerHTML = h.length ? h.map((b,i)=>`
    <div class="card">
      <div class="game-head"><strong>${b.evento||b.seleccion||"Apuesta"}</strong><span class="badge">${b.resultado}</span></div>
      <div class="small">${b.casa||""} · ${b.moneda||""} ${b.monto_apostado||"?"} @ ${b.cuota||"?"}</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        <button onclick="setResult(${i},'ganada')">✅ Ganada</button>
        <button onclick="setResult(${i},'perdida')">❌ Perdida</button>
        <button onclick="delBet(${i})">🗑</button>
      </div>
    </div>`).join("") : '<div class="loading">Sin apuestas registradas.</div>';
}
function setResult(i,r){ const h=getHist(); h[i].resultado=r; setHist(h); renderConta(); }
function delBet(i){ const h=getHist(); h.splice(i,1); setHist(h); renderConta(); }
function resetHist(){ if(confirm("¿Borrar todo el historial?")){ localStorage.removeItem("neonbet_hist"); updateCapital(); renderConta(); } }
</script>
</body>
</html>
